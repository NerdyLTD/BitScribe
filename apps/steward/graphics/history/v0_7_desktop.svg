  <rect x="945" y="424" width="100" height="18" rx="3" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="0.8" />
  <text x="962" y="437" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#EF4444">UNFRIENDLY</text>

