  <text x="965" y="377" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#10B981">SAFE PASS</text>

  <line x1="330" y1="404" x2="1065" y2="404" stroke="#1E293B" stroke-width="0.8" />

