
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="150" height="150" style="overflow: visible;">
  <!-- Clapper Base (Body) -->
  <rect x="20" y="40" width="60" height="40" rx="8" fill="#ffffff" stroke="#1e232e" stroke-width="4" />
  <path d="M22 48 L78 48 M22 51 L78 51 M22 72 L78 72 M22 75 L78 75" stroke="#1e232e" stroke-width="1" opacity="0.2" />
  
  <!-- Legs -->
  <path d="M35 80 L35 92 M65 80 L65 92" stroke="#1e232e" stroke-width="4" stroke-linecap="round" />
  <!-- Feet -->
  <path d="M35 92 L40 92 M65 92 L70 92" stroke="#1e232e" stroke-width="4" stroke-linecap="round" />
  
  <!-- Arms -->
  <path d="M20 55 Q5 50 -5 30" fill="none" stroke="#1e232e" stroke-width="4" stroke-linecap="round" />
  <path d="M80 55 Q95 50 105 30" fill="none" stroke="#1e232e" stroke-width="4" stroke-linecap="round" />

  <!-- Clapper Top (Head/Hat) -->
  <g transform="rotate(-15 20 40)">
    <clipPath id="bitsy-clip">
      <rect x="20" y="25" width="60" height="15" rx="4" />
    </clipPath>
    <rect x="20" y="25" width="60" height="15" rx="4" fill="#ffffff" stroke="#1e232e" stroke-width="4" />
    <g clip-path="url(#bitsy-clip)">
      <polygon points="10,40 15,25 25,25 20,40" fill="#1e232e" />
      <polygon points="20,40 25,25 35,25 30,40" fill="#1e232e" />
      <polygon points="30,40 35,25 45,25 40,40" fill="#22c55e" />
      <polygon points="40,40 45,25 55,25 50,40" fill="#eab308" />
      <polygon points="50,40 55,25 65,25 60,40" fill="#3b82f6" />
      <polygon points="60,40 65,25 75,25 70,40" fill="#ef4444" />
      <polygon points="70,40 75,25 85,25 80,40" fill="#ffffff" />
    </g>
    <rect x="20" y="25" width="60" height="15" rx="4" fill="none" stroke="#1e232e" stroke-width="4" />
    <!-- Pink Bow -->
    <path d="M45 20 Q50 15 55 20 Q50 25 45 20 Z" fill="#ec4899" stroke="#be185d" stroke-width="1" />
    <path d="M55 20 Q60 15 65 20 Q60 25 55 20 Z" fill="#ec4899" stroke="#be185d" stroke-width="1" />
    <circle cx="55" cy="20" r="3" fill="#fbcfe8" />
  </g>
  
  <!-- Face -->
  <g>
    <!-- Left Eye -->
    <circle cx="34" cy="55" r="7.5" fill="white" stroke="#1e232e" stroke-width="2" />
    <circle cx="34" cy="55.5" r="5" fill="#1e293b" />
    <circle cx="32" cy="53" r="2.2" fill="white" />
    <circle cx="36.5" cy="58" r="1" fill="white" />
    <circle cx="32" cy="58" r="0.8" fill="white" />
    
    <!-- Left Eyelashes -->
    <path d="M 24 53 Q 32 43 43 51" stroke="#1e232e" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 26 49 Q 22 43 21 46" stroke="#1e232e" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 31 46 Q 28 39 27 41" stroke="#1e232e" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 36 46 Q 35 38 34 40" stroke="#1e232e" stroke-width="2" fill="none" stroke-linecap="round" />
    
    <!-- Right Eye -->
    <circle cx="66" cy="55" r="7.5" fill="white" stroke="#1e232e" stroke-width="2" />
    <circle cx="66" cy="55.5" r="5" fill="#1e293b" />
    <circle cx="64" cy="53" r="2.2" fill="white" />
    <circle cx="68.5" cy="58" r="1" fill="white" />
    <circle cx="64" cy="58" r="0.8" fill="white" />
    
    <!-- Right Eyelashes -->
    <path d="M 57 51 Q 68 43 76 53" stroke="#1e232e" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 74 49 Q 78 43 79 46" stroke="#1e232e" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 69 46 Q 72 39 73 41" stroke="#1e232e" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 64 46 Q 65 38 66 40" stroke="#1e232e" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
  
  <!-- Cheeks -->
  <ellipse cx="25" cy="62" rx="4" ry="2.5" fill="#ec4899" opacity="0.4" />
  <ellipse cx="75" cy="62" rx="4" ry="2.5" fill="#ec4899" opacity="0.4" />
  
  <!-- Mouth (Excited) -->
  <path d="M45 65 Q50 75 55 65 Z" fill="#ec4899" stroke="#1e232e" stroke-width="2" stroke-linecap="round" />
</svg>
