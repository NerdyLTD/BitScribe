version: "3.8"

services:
  bitscribe-dmls:
    build: .
    container_name: bitscribe-dmls
    ports:
      - "3000:3000"
    volumes:
      # Map your host media directories here
      - /path/to/your/movies:/movies:ro
      - /path/to/your/tvshows:/tvshows:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
