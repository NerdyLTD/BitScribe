<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitScribeRX Mockup 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 h-screen w-screen p-4 flex flex-col gap-4 text-slate-200 font-sans overflow-hidden">
    
    <!-- Header Area -->
    <header class="h-16 flex-none bg-[#14171F] rounded-xl flex items-center px-6 border border-slate-800 justify-between relative">
        <!-- Left: Mode Dropdown -->
        <div class="h-10 w-64 bg-slate-900 rounded-lg flex items-center px-4 border border-slate-700 justify-between cursor-pointer hover:bg-slate-800 transition-colors z-10">
            <span class="text-slate-200 font-medium text-sm">Mode: Metadata Editor</span>
            <span class="text-slate-500 text-xs">▼</span>
        </div>
        
        <!-- Center: Logo block (Absolute centered) -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center">
            <div class="h-8 w-40 bg-blue-900/30 rounded flex items-center justify-center border border-blue-700/50 text-blue-400 font-bold tracking-widest text-sm">BitScribeRX</div>
        </div>
        
        <!-- Right: Progress Meter / Queue Status -->
        <div class="flex items-center gap-3 z-10 w-64 justify-end">
            <div class="flex flex-col items-end justify-center w-full">
                <div class="flex justify-between w-full text-[10px] text-slate-400 uppercase tracking-widest mb-1">
                    <span>Processing Queue (1/3)</span>
                    <span class="text-emerald-400 font-bold">45%</span>
                </div>
                <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden border border-slate-700/50">
                    <div class="h-full w-[45%] bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex gap-4 min-h-0">
        
        <!-- Left Column: Functions & Configuration (Sidebar) -->
        <div class="flex-none w-80 flex flex-col gap-4 min-h-0">
            <!-- Mode-Specific Configuration Panel -->
            <div class="flex-1 bg-[#14171F] rounded-xl border border-slate-800 p-4 flex flex-col gap-4">
                <div class="text-slate-500 font-semibold text-xs tracking-widest uppercase flex justify-between items-center">
                    <span>Task Configuration</span>
                </div>
                
                <div class="flex-1 border border-slate-800 rounded-lg flex flex-col p-4 gap-4 bg-slate-900/50 overflow-y-auto">
                    <!-- Form block representation -->
                    <div class="flex flex-col gap-2">
                        <div class="h-3 w-24 bg-slate-700 rounded"></div>
                        <div class="h-10 w-full bg-slate-950 rounded border border-slate-800"></div>
                    </div>
                    
                    <div class="flex flex-col gap-2">
                        <div class="h-3 w-32 bg-slate-700 rounded"></div>
                        <div class="h-10 w-full bg-slate-950 rounded border border-slate-800"></div>
                    </div>

                    <div class="flex flex-col gap-2">
                        <div class="h-3 w-16 bg-slate-700 rounded"></div>
                        <div class="h-20 w-full bg-slate-950 rounded border border-slate-800"></div>
                    </div>
                </div>
                
                <div class="flex justify-between items-center px-1">
                     <span class="text-blue-400 text-xs font-semibold">2 Items Selected</span>
                </div>
                <div class="h-12 bg-blue-600 hover:bg-blue-500 transition-colors text-white rounded-lg flex items-center justify-center font-bold tracking-wide cursor-pointer shadow-lg shadow-blue-900/20">
                    START BATCH PROCESS
                </div>
            </div>
        </div>

        <!-- Right/Center Column: Library & Selection -->
        <div class="flex-1 flex flex-col gap-4 min-w-0">
            <!-- Filter Bar -->
            <div class="h-14 bg-[#14171F] rounded-xl border border-slate-800 flex items-center px-4 gap-4 flex-none">
                <div class="h-8 flex-1 bg-slate-950 rounded border border-slate-800 flex items-center px-3 text-slate-600 text-sm">🔍 Filter & Search Data...</div>
                <div class="h-8 w-24 bg-slate-800 rounded flex items-center justify-center text-slate-400 text-xs">Filter 1</div>
                <div class="h-8 w-24 bg-slate-800 rounded flex items-center justify-center text-slate-400 text-xs">Filter 2</div>
                <div class="h-8 w-24 bg-slate-800 rounded flex items-center justify-center text-slate-400 text-xs">Columns ▼</div>
            </div>

            <!-- Library View -->
            <div class="flex-1 bg-[#14171F] rounded-xl border border-slate-800 p-4 flex flex-col gap-2 overflow-hidden">
                <div class="text-slate-500 font-semibold text-xs tracking-widest uppercase mb-2">Library / Target Selection</div>
                
                <!-- Table Header -->
                <div class="h-8 bg-slate-900/80 rounded flex gap-2 p-2 items-center px-4">
                    <div class="w-4 h-4 bg-slate-800 rounded-sm"></div>
                    <div class="flex-1 h-3 bg-slate-700 rounded ml-2"></div>
                    <div class="w-32 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                </div>
                <!-- Rows -->
                <div class="h-10 bg-blue-900/10 border border-blue-900/30 rounded flex gap-2 p-2 items-center px-4">
                    <div class="w-4 h-4 bg-blue-500 rounded-sm flex items-center justify-center text-[10px] text-white">✓</div>
                    <div class="flex-1 h-3 bg-blue-400/50 rounded ml-2"></div>
                    <div class="w-32 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                </div>
                <div class="h-10 bg-slate-900/30 rounded flex gap-2 p-2 items-center px-4 hover:bg-slate-800/50">
                    <div class="w-4 h-4 bg-slate-800 border border-slate-700 rounded-sm"></div>
                    <div class="flex-1 h-3 bg-slate-600 rounded ml-2"></div>
                    <div class="w-32 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                </div>
                <div class="h-10 bg-slate-900/30 rounded flex gap-2 p-2 items-center px-4 hover:bg-slate-800/50">
                    <div class="w-4 h-4 bg-slate-800 border border-slate-700 rounded-sm"></div>
                    <div class="flex-1 h-3 bg-slate-600 rounded ml-2"></div>
                    <div class="w-32 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                </div>
                <div class="h-10 bg-slate-900/30 rounded flex gap-2 p-2 items-center px-4 hover:bg-slate-800/50">
                    <div class="w-4 h-4 bg-slate-800 border border-slate-700 rounded-sm"></div>
                    <div class="flex-1 h-3 bg-slate-600 rounded ml-2"></div>
                    <div class="w-32 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                </div>
                <div class="h-10 bg-blue-900/10 border border-blue-900/30 rounded flex gap-2 p-2 items-center px-4">
                    <div class="w-4 h-4 bg-blue-500 rounded-sm flex items-center justify-center text-[10px] text-white">✓</div>
                    <div class="flex-1 h-3 bg-blue-400/50 rounded ml-2"></div>
                    <div class="w-32 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                </div>
                <div class="h-10 bg-slate-900/30 rounded flex gap-2 p-2 items-center px-4 hover:bg-slate-800/50">
                    <div class="w-4 h-4 bg-slate-800 border border-slate-700 rounded-sm"></div>
                    <div class="flex-1 h-3 bg-slate-600 rounded ml-2"></div>
                    <div class="w-32 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                    <div class="w-24 h-3 bg-slate-700 rounded"></div>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
