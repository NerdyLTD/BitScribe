<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <!-- Rich dark-space background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1E2333" />
      <stop offset="60%" stop-color="#0E1118" />
      <stop offset="100%" stop-color="#07080C" />
    </radialGradient>

    <!-- Vibrant Quill gradients -->
    <linearGradient id="quillGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Wave Glow -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Rich Card Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="4" />

  <!-- Ambient lighting glows in corners -->
  <circle cx="120" cy="120" r="180" fill="#8B5CF6" opacity="0.12" filter="url(#blur40)" />
  <circle cx="400" cy="380" r="150" fill="#06B6D4" opacity="0.1" filter="url(#blur40)" />

  <!-- Main Graphic Container (Centered) -->
  <g transform="translate(16, -16)">
    <!-- Visual background framework lines (Scribe Grid) -->
    <path d="M 120 340 L 220 340 L 260 300" stroke="#1F293D" stroke-dasharray="6 6" stroke-width="2" opacity="0.6" />
    <path d="M 380 140 L 300 140 L 260 180" stroke="#1F293D" stroke-dasharray="6 6" stroke-width="2" opacity="0.6" />

    <!-- Waveforms Trailing from Quill (The optical soundwave stream) -->
    <!-- Purple Core Wave -->
    <path d="M 280,180 C 340,140 370,250 440,170 C 470,135 480,150 495,110" 
          stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    
    <!-- Electric Blue Wave (Primary Glowing Wave) -->
    <path d="M 260,200 C 320,160 380,290 450,190 C 480,145 490,165 510,120" 
          stroke="#3B82F6" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glowEffect)" />
    
    <!-- Magenta Precision Peak Wave -->
    <path d="M 300,160 C 350,120 390,225 430,150 C 450,112 460,130 475,90" 
          stroke="#EC4899" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Horizontal rack alignment lines for audio channels -->
    <line x1="330" y1="180" x2="330" y2="240" stroke="#313D56" stroke-width="2" stroke-dasharray="2 3" />
    <line x1="370" y1="150" x2="370" y2="230" stroke="#313D56" stroke-width="2" />
    <line x1="410" y1="120" x2="410" y2="210" stroke="#1F293D" stroke-width="2" />

    <!-- Beautiful Quill Stylus (pointing down-left represent precise audit check) -->
    <!-- Sharp elegant diagonal stylus geometry -->
    <path d="M 120,340 Q 180,300 230,220 L 250,240 Q 200,320 120,340 Z" fill="url(#quillGold)" />
    <!-- Scribe point tip overlay (Reinforced metal alloy nib effect) -->
    <path d="M 100,360 L 120,340 L 140,360 Z" fill="#E9D5FF" />
    <path d="M 80,380 L 100,360 L 120,380 Z" fill="#F5F3FF" />

    <!-- Perfectly separated gap stylus split (so it doesn't need a dark stroke!) -->
    <!-- This preserves high-contrast beauty with zero background dependencies -->
    <line x1="90" y1="370" x2="215" y2="245" stroke="#0E1118" stroke-width="4" stroke-linecap="round" />

    <!-- Film Frame / Sprocket Holes along the diagonal outer borders of the Quill body -->
    <!-- Left outer frame hole anchors -->
    <rect x="170" y="275" width="8" height="8" rx="2" fill="#0E1118" transform="rotate(-45 174 279)" />
    <rect x="190" y="255" width="8" height="8" rx="2" fill="#0E1118" transform="rotate(-45 194 259)" />
    <rect x="210" y="235" width="8" height="8" rx="2" fill="#0E1118" transform="rotate(-45 214 239)" />
    
    <!-- Right outer frame hole anchors -->
    <rect x="145" y="300" width="8" height="8" rx="2" fill="#0E1118" transform="rotate(-45 149 304)" />
    <rect x="125" y="320" width="8" height="8" rx="2" fill="#0E1118" transform="rotate(-45 129 324)" />

    <!-- Digital bits orbits (The data caretakers) -->
    <circle cx="160" cy="180" r="6" fill="#3B82F6" />
    <circle cx="190" cy="150" r="4" fill="#06B6D4" filter="url(#glowEffect)" />
    <circle cx="230" cy="320" r="5" fill="#8B5CF6" />
    <circle cx="310" cy="290" r="3" fill="#4B5563" />
  </g>

  <!-- Typographic Lockup inside the logo standard -->
  <text x="256" y="415" 
        font-family="'Inter', system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="9" 
        text-anchor="middle" 
        fill="#FFFFFF">BITSCRIBE</text>

  <text x="256" y="450" 
        font-family="'Inter', system-ui, -apple-system, sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#94A3B8">THE DIGITAL MEDIA LIBRARY STEWARD</text>

  <text x="256" y="475" 
        font-family="'Inter', system-ui, -apple-system, sans-serif" 
        font-size="10" 
        font-weight="500" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#64748B" 
        font-style="italic">Direct Play Audits &amp; Library Caretaking</text>
</svg>
