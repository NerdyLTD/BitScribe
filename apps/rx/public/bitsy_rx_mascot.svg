<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Lab Coat Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Owl Feather Body Gradient -->
    <linearGradient id="owlBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Film Reel Metallic Grad -->
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Red Cross / RX Badge Grad -->
    <linearGradient id="rxRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGlow)"/>

  <g filter="url(#shadow)">
    <!-- Owl Ears / Tufts -->
    <path d="M 80 75 L 60 38 L 98 58 Z" fill="#0284c7" />
    <path d="M 176 75 L 196 38 L 158 58 Z" fill="#0284c7" />
    <path d="M 82 72 L 68 46 L 94 60 Z" fill="#38bdf8" />
    <path d="M 174 72 L 188 46 L 162 60 Z" fill="#38bdf8" />

    <!-- Owl Head -->
    <ellipse cx="128" cy="92" rx="56" ry="46" fill="url(#owlBodyGrad)" />

    <!-- Eye Patches (White/Light Feather Circles) -->
    <circle cx="106" cy="88" r="22" fill="#ffffff" />
    <circle cx="150" cy="88" r="22" fill="#ffffff" />

    <!-- Pupil & Iris (Expressive Caring Eyes) -->
    <circle cx="109" cy="88" r="12" fill="#0f172a" />
    <circle cx="147" cy="88" r="12" fill="#0f172a" />
    <circle cx="111" cy="85" r="4" fill="#ffffff" />
    <circle cx="149" cy="85" r="4" fill="#ffffff" />
    <circle cx="107" cy="91" r="2" fill="#ffffff" />
    <circle cx="145" cy="91" r="2" fill="#ffffff" />

    <!-- Beak -->
    <polygon points="128,96 122,108 134,108" fill="#f59e0b" />

    <!-- Cute Cheeks -->
    <ellipse cx="90" cy="98" rx="7" ry="4" fill="#f43f5e" opacity="0.4" />
    <ellipse cx="166" cy="98" rx="7" ry="4" fill="#f43f5e" opacity="0.4" />

    <!-- Doctor Lab Coat (Body) -->
    <path d="M 76 130 C 70 160 72 210 74 220 L 182 220 C 184 210 186 160 180 130 C 160 122 96 122 76 130 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Coat Lapels / Collar -->
    <polygon points="128,132 100,130 84,158 118,170" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <polygon points="128,132 156,130 172,158 138,170" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Red RX Pocket Badge -->
    <rect x="88" y="175" width="22" height="26" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Red Cross on Pocket -->
    <path d="M 99 180 L 99 196 M 91 188 L 107 188" stroke="url(#rxRedGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Stethoscope -->
    <path d="M 100 130 C 95 150 98 175 128 178 C 158 175 161 150 156 130" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="128" cy="178" r="6" fill="#94a3b8" stroke="#334155" stroke-width="2" />
    <circle cx="128" cy="178" r="2" fill="#ef4444" />

    <!-- Caring Arms / Wings holding the Reel -->
    <!-- Left Wing/Arm in Lab Coat -->
    <path d="M 76 135 C 60 150 58 178 80 185 C 88 185 95 178 98 170" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Right Wing/Arm in Lab Coat -->
    <path d="M 180 135 C 196 150 198 178 176 185 C 168 185 161 178 158 170" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- ================= SICK FILM REEL CHARACTER ================= -->
    <g transform="translate(128, 172)">
      <!-- Outer Reel Outer Rim -->
      <circle cx="0" cy="0" r="32" fill="url(#reelGrad)" stroke="#1e293b" stroke-width="2" />
      <circle cx="0" cy="0" r="28" fill="#1e293b" />

      <!-- Coiled Film Inside -->
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2" />

      <!-- Reel Cutout Windows (6 Spoke Holes) -->
      <circle cx="0" cy="-15" r="5" fill="#334155" stroke="#64748b" stroke-width="1" />
      <circle cx="13" cy="-7.5" r="5" fill="#334155" stroke="#64748b" stroke-width="1" />
      <circle cx="13" cy="7.5" r="5" fill="#334155" stroke="#64748b" stroke-width="1" />
      <circle cx="0" cy="15" r="5" fill="#334155" stroke="#64748b" stroke-width="1" />
      <circle cx="-13" cy="7.5" r="5" fill="#334155" stroke="#64748b" stroke-width="1" />
      <circle cx="-13" cy="-7.5" r="5" fill="#334155" stroke="#64748b" stroke-width="1" />

      <!-- Center Spindle Hub -->
      <circle cx="0" cy="0" r="8" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3" fill="#0f172a" />

      <!-- Sad Sick Face Features on the Reel -->
      <!-- Sad Dizzy/Drawn Eyes (> < or X X) -->
      <!-- Left Eye: Sad Droopy Eyebrow + Eye -->
      <path d="M -10 -8 Q -6 -12 -2 -8" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <path d="M -8 -4 L -4 0 M -4 -4 L -8 0" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />

      <!-- Right Eye: Sad Droopy Eyebrow + Eye -->
      <path d="M 2 -8 Q 6 -12 10 -8" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <path d="M 4 -4 L 8 0 M 8 -4 L 4 0" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />

      <!-- Sad Wavy Mouth -->
      <path d="M -7 12 Q -2 8 3 13 Q 7 15 10 11" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" />

      <!-- THERMOMETER sticking out of mouth -->
      <g transform="rotate(-25, 2, 10)">
        <!-- Glass Tube -->
        <rect x="2" y="7" width="24" height="6" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
        <!-- Red Mercury Liquid -->
        <rect x="3" y="8" width="16" height="4" rx="2" fill="#ef4444" />
        <!-- Bulb -->
        <circle cx="4" cy="10" r="4" fill="#dc2626" />
        <!-- Temperature Tick Lines -->
        <line x1="12" y1="7" x2="12" y2="9" stroke="#64748b" stroke-width="1" />
        <line x1="16" y1="7" x2="16" y2="9" stroke="#64748b" stroke-width="1" />
        <line x1="20" y1="7" x2="20" y2="9" stroke="#64748b" stroke-width="1" />
      </g>

      <!-- Band-aid on upper rim of reel -->
      <g transform="translate(-18, -20) rotate(20)">
        <rect x="0" y="0" width="16" height="8" rx="2" fill="#fde047" stroke="#d97706" stroke-width="1" />
        <rect x="5" y="1" width="6" height="6" fill="#fef08a" />
        <circle cx="3" cy="4" r="0.5" fill="#b45309" />
        <circle cx="13" cy="4" r="0.5" fill="#b45309" />
      </g>

      <!-- Ice Pack / Fever Cloth on top of the reel -->
      <path d="M -12 -26 C -8 -32 8 -32 12 -26 C 14 -22 -14 -22 -12 -26 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
      <path d="M -6 -28 C -2 -34 2 -34 6 -28" fill="none" stroke="#bae6fd" stroke-width="1" />
    </g>
  </g>
</svg>
