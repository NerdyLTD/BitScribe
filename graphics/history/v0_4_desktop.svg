  <path d="M100 0 V750 M200 0 V750 M300 0 V750 M400 0 V750 M500 0 V750 M600 0 V750 M700 0 V750 M800 0 V750 M900 0 V750 M1000 0 V750 M1100 0 V750" stroke="#E2E8F0" stroke-width="1" />

  <!-- Desktop Browser Window Frame -->
  <rect x="80" y="60" width="1040" height="620" rx="10" fill="#FFFFFF" filter="url(#shadowV4)" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- OS Browser Header Bar -->
  <path d="M80 70 C80 64.48 84.48 60 90 60 H1110 C1115.52 60 1120 64.48 1120 70 V100 H80 V70 Z" fill="#E2E8F0" />
  <line x1="80" y1="100" x2="1120" y2="100" stroke="#CBD5E1" stroke-width="1" />
  
  <!-- macOS Controls -->
  <circle cx="105" cy="80" r="5.5" fill="#EF4444" />
  <circle cx="123" cy="80" r="5.5" fill="#F59E0B" />
  <circle cx="141" cy="80" r="5.5" fill="#10B981" />

