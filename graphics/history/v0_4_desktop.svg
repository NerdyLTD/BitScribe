  <!-- Left Side: Interactive Rule Builder Panel -->
  <rect x="110" y="190" width="310" height="380" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="130" y="218" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#334155" letter-spacing="0.5">EXPORT COLUMN TOGGLES</text>
  
