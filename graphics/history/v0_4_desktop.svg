  <rect x="190" y="70" width="820" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="202" y="84" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">localhost:3000/v0.4-rule-profiles</text>

