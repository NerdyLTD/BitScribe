  <rect x="130" y="285" width="12" height="12" rx="2" stroke="#CBD5E1" stroke-width="1.5" fill="#FFFFFF" />
  <text x="150" y="296" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Include Bitrate Info (Draft)</text>

  <rect x="130" y="310" width="12" height="12" rx="2" stroke="#2563EB" stroke-width="1.5" fill="#FFFFFF" />
  <path d="M132 314 L135 317 L140 312" stroke="#2563EB" stroke-width="1.5" fill="none" />
  <text x="150" y="321" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0F172A">Include Remediation Action</text>

  <line x1="130" y1="340" x2="390" y2="340" stroke="#E2E8F0" stroke-width="1" />

  <!-- Active Media Compliance ruleset selection -->
  <text x="130" y="365" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#334155" letter-spacing="0.5">COMPLIANCE CRITERIA</text>
  
  <rect x="130" y="380" width="270" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="142" y="399" font-family="'Inter', sans-serif" font-size="11" fill="#0F172A">Rules profile: Direct Stream Compatibility</text>
  <path d="M380 392 L384 397 L388 392" stroke="#64748B" stroke-width="1.5" fill="none" />

  <!-- Rule details description info -->
  <text x="130" y="430" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Accept: HEVC / h264 / aac / ac3</text>
  <text x="130" y="445" font-family="'Inter', sans-serif" font-size="10" fill="#EF4444">Alert: avi / wmv / flac / dts-ma</text>

  <rect x="130" y="475" width="270" height="35" rx="4" fill="#F1F5F9" stroke="#E2E8F0" />
  <text x="142" y="496" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2563EB">💡 14 files compliant of 18</text>

