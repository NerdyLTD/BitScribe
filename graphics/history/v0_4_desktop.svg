  <rect x="80" y="100" width="1040" height="70" fill="#F8FAFC" />
  <line x1="80" y1="170" x2="1120" y2="170" stroke="#E2E8F0" stroke-width="1.2" />

  <text x="110" y="142" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#0F172A">MediaReporter v0.4</text>
  <text x="330" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Introducing early draft profiles, interactive report columns check &amp; auto-matching rules</text>

  <!-- Action buttons -->
  <rect x="800" y="118" width="130" height="34" rx="4" fill="none" stroke="#64748B" stroke-width="1.2" />
  <text x="824" y="139" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748B">Reset Prefs</text>

  <rect x="945" y="118" width="135" height="34" rx="4" fill="#2563EB" />
  <text x="965" y="139" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">📥 Export Excel</text>

