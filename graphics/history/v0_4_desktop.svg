  <!-- Row 1 -->
  <rect x="130" y="235" width="12" height="12" rx="2" stroke="#2563EB" stroke-width="1.5" fill="#FFFFFF" />
  <path d="M132 239 L135 242 L140 237" stroke="#2563EB" stroke-width="1.5" fill="none" />
  <text x="150" y="246" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0F172A">Include File Path</text>

  <!-- Row 2 -->
  <rect x="130" y="260" width="12" height="12" rx="2" stroke="#2563EB" stroke-width="1.5" fill="#FFFFFF" />
  <path d="M132 264 L135 267 L140 262" stroke="#2563EB" stroke-width="1.5" fill="none" />
  <text x="150" y="271" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0F172A">Include Audio Codec</text>

