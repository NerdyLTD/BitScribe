  <!-- Row 1 -->
  <text x="460" y="255" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A">Inception.mkv</text>
  <text x="460" y="268" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Path: /volume1/movies/Inception.mkv</text>
  <text x="750" y="260" font-family="'Inter', sans-serif" font-size="11" fill="#334155">h264 / AAC</text>
  <rect x="960" y="246" width="100" height="20" rx="4" fill="#D1FAE5" />
  <text x="982" y="259" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#065F46">DIRECT PLAY</text>

  <line x1="440" y1="285" x2="1080" y2="285" stroke="#E2E8F0" stroke-width="0.8" />

  <!-- Row 2 -->
  <text x="460" y="310" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A">Toy_Story_3_Full.avi</text>
  <text x="460" y="323" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Path: /volume1/movies/Toy_Story.avi</text>
  <text x="750" y="315" font-family="'Inter', sans-serif" font-size="11" fill="#EF4444">mpeg4 (avi)</text>
  <rect x="960" y="301" width="100" height="20" rx="4" fill="#FEE2E2" />
  <text x="982" y="314" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#991B1B">TRANSCODE</text>

  <line x1="440" y1="340" x2="1080" y2="340" stroke="#E2E8F0" stroke-width="0.8" />

  <!-- Row 3 -->
  <text x="460" y="365" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A">Interestellar_1080p.mkv</text>
  <text x="460" y="378" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Path: /volume1/movies/Interstellar.mkv</text>
  <text x="750" y="370" font-family="'Inter', sans-serif" font-size="11" fill="#D97706">h264 (DTS Audio)</text>
  <rect x="960" y="356" width="100" height="20" rx="4" fill="#FEF3C7" />
  <text x="980" y="369" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#92400E">DTS TRANSCODE</text>

  <line x1="440" y1="395" x2="1080" y2="395" stroke="#E2E8F0" stroke-width="0.8" />

  <!-- Action remediation hint underneath -->
  <rect x="460" y="420" width="600" height="110" rx="6" fill="#EFF6FF" stroke="#BFDBFE" />
  <text x="475" y="442" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#1E40AF">REMEDIATION LOGSUGGESTION FOR DRAFT REPORTS</text>
  <text x="475" y="464" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#0F172A">Unfriendly containers (avi) cause severe NAS CPU transcoding spikes.</text>
  <text x="475" y="482" font-family="'Inter', sans-serif" font-size="11" fill="#1E40AF">Excel reports will output automated FFmpeg command strings for rapid conversion.</text>

  <!-- Browser Window Footer bar -->
