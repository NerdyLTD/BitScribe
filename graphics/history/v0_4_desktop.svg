  <line x1="80" y1="630" x2="1120" y2="630" stroke="#CBD5E1" stroke-width="1.2" />
  <text x="110" y="656" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">PlexAuditor local db sync active | v0.4.x stable profile setup</text>
