<svg viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg" width="1920" height="1200">
  <defs>
    <!-- Slate Dark mode Radial background -->
    <radialGradient id="bgGradV5" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <filter id="shadowV5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer canvas wrapper -->
  <rect width="1200" height="750" fill="#0B0F19" />

  <!-- Gorgeous Slate Window frame -->
  <rect x="80" y="60" width="1040" height="620" rx="12" fill="url(#bgGradV5)" filter="url(#shadowV5)" stroke="#334155" stroke-width="1.8" />

  <!-- OS Browser Header Bar -->
  <path d="M80 72 C80 65.37 85.37 60 92 60 H1108 C1114.63 60 1120 65.37 1120 72 V100 H80 V72 Z" fill="#0F172A" />
  <line x1="80" y1="100" x2="1120" y2="100" stroke="#1E293B" stroke-width="1.2" />

  <!-- macOS Controls -->
  <circle cx="105" cy="80" r="5" fill="#EF4444" />
  <circle cx="121" cy="80" r="5" fill="#F59E0B" />
  <circle cx="137" cy="80" r="5" fill="#10B981" />

  <!-- URL Bar -->
  <rect x="180" y="68" width="840" height="20" rx="5" fill="#030712" stroke="#1E293B" />
  <text x="192" y="82" font-family="'Inter', sans-serif" font-size="11" fill="#4B5563">localhost:3000/plex-custom-scanner-v0.5</text>

  <!-- Left Sidebar (First implementation of fully custom Sidebar) -->
  <rect x="80" y="100" width="220" height="540" fill="#090D16" />
  <line x1="300" y1="100" x2="300" y2="640" stroke="#1E293B" stroke-width="1" />

  <text x="100" y="138" font-family="'Inter', sans-serif" font-size="14" font-weight="950" fill="#FFFFFF">PlexAuditor</text>
  <text x="188" y="137" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#8B5CF6">v0.5</text>

  <!-- Sidebar Links -->
  <rect x="90" y="170" width="200" height="30" rx="6" fill="#1E293B" />
  <text x="110" y="190" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">📊 Dashboard</text>
  <text x="110" y="230" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">⚙️ Scan Settings</text>
  <text x="110" y="270" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">📑 Export Configuration</text>

  <!-- Scanner engine simple logs widget in sidebar -->
  <rect x="90" y="450" width="200" height="150" rx="6" fill="#030712" stroke="#1E293B" />
  <circle cx="110" cy="470" r="3" fill="#10B981" />
  <text x="120" y="474" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#10B981">LIVE MONITOR</text>
  <text x="100" y="505" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">[SCAN] Folder movies parsed</text>
  <text x="100" y="525" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">[SCAN] 48 mp4 files mapped</text>
  <text x="100" y="545" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">[SCAN] 2 corrupted files</text>
  <text x="100" y="565" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A78BFA">[WARN] avi transcoder match</text>

  <!-- Main view Workspace Header -->
  <text x="330" y="140" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">Plex Slate Mode</text>
  <text x="330" y="158" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">High precision dashboard overlay with custom background logs visualizers</text>

  <!-- Action button top right wrapper -->
  <rect x="965" y="118" width="125" height="34" rx="6" fill="#8B5CF6" />
  <text x="985" y="139" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">📥 Create Excel</text>

  <!-- Bento Stats Cards v0.5 -->
  <!-- Stats Box 1 -->
  <rect x="330" y="186" width="235" height="80" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="345" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#94A3B8" letter-spacing="1">INDEXED MEDIA TOTAL</text>
  <text x="345" y="244" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#3B82F6">182 items</text>

  <!-- Stats Box 2 -->
  <rect x="580" y="186" width="235" height="80" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="595" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#94A3B8" letter-spacing="1">TOTAL SIZE</text>
  <text x="595" y="244" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#10B981">842 GB</text>

  <!-- Stats Box 3 -->
  <rect x="830" y="186" width="235" height="80" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="845" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#EF4444" letter-spacing="1">CORRUPTED REGISTRY</text>
  <text x="845" y="244" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#EF4444">2 items</text>

  <!-- Main dynamic listing area -->
  <rect x="330" y="286" width="735" height="280" rx="8" fill="#131B2E" stroke="#1E293B" />
  
  <rect x="330" y="286" width="735" height="34" fill="#111827" />
  <line x1="330" y1="320" x2="1065" y2="320" stroke="#1E293B" />

  <!-- Columns -->
  <text x="345" y="308" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#64748B">FILE REGISTRY &amp; COMPLY CHECKER</text>
  
  <!-- Movie Items Row 1 -->
  <text x="345" y="348" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">The_Dark_Knight_2008.mkv</text>
  <text x="345" y="362" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">/volume1/media/The_Dark_Knight.mkv</text>
  <text x="700" y="354" font-family="'Inter', sans-serif" font-size="11" fill="#E2E8F0">h264 / AAC (Direct Play)</text>
  <rect x="945" y="340" width="100" height="18" rx="3" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="0.8" />
  <text x="965" y="353" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#10B981">YES (Safe)</text>

  <line x1="330" y1="380" x2="1065" y2="380" stroke="#1E293B" stroke-width="0.8" />

  <!-- Movie Items Row 2 (Unfriendly corrupt) -->
  <text x="345" y="408" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Interstellar_Corrupted_DRAFT.mp4</text>
  <text x="345" y="422" font-family="'Inter', sans-serif" font-size="10" fill="#EF4444">/volume1/media/Interstellar_Corrupted.mp4 (Read failure)</text>
  <text x="700" y="414" font-family="'Inter', sans-serif" font-size="11" fill="#EF4444">Parser error: Corrupted header</text>
  <rect x="945" y="400" width="100" height="18" rx="3" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="0.8" />
  <text x="962" y="413" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#EF4444">NO (Corrupt)</text>

  <line x1="330" y1="440" x2="1065" y2="440" stroke="#1E293B" stroke-width="0.8" />

  <!-- Custom Export criteria preset footer preview info -->
  <text x="345" y="475" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#A78BFA">ACTIVE EXCLUDE FILTERS</text>
  <text x="345" y="495" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Excluded: legacy files below 10MB, metadata folders (.plex, .stmp), raw audio cover artwork jpg.</text>

  <rect x="345" y="515" width="240" height="34" rx="4" fill="#1E293B" stroke="#334155" />
  <text x="360" y="536" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">⚙️ Adjust Codec Rulesets</text>

  <!-- Browser Window Footer -->
  <path d="M80 640 V670 C80 675.52 84.48 680 90 680 H1108 C1114.63 680 1120 675.52 1120 670 V640 Z" fill="#0F172A" />
  <line x1="80" y1="640" x2="1120" y2="640" stroke="#1E293B" stroke-width="1.2" />
  <text x="110" y="666" font-family="'Inter', sans-serif" font-size="11" fill="#4B5563">Draft 0.5 database synchronization status: active SQLite master storage</text>
</svg>
