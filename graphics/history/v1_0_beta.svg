<svg viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg" width="1920" height="1200">
  <!-- Definitions of styles and filters -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Header Quill Pen Gradient -->
    <linearGradient id="headerQuillGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Visual shadows and glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadowV3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer canvas wrapper -->
  <rect width="1200" height="750" fill="#090D16" />

  <!-- Abstract Cosmic Swirl Accents in the main canvas background -->
  <circle cx="200" cy="150" r="280" fill="#8B5CF6" fill-opacity="0.04" filter="url(#glow)" />
  <circle cx="1000" cy="550" r="320" fill="#3B82F6" fill-opacity="0.03" filter="url(#glow)" />

  <!-- Gorgeous Browser Frame -->
  <rect x="60" y="40" width="1080" height="660" rx="16" fill="url(#bgGrad)" filter="url(#shadowV3)" stroke="#1F2937" stroke-width="2" />

  <!-- OS Browser Header Bar -->
  <path d="M60 56 C60 47.16 67.16 40 76 40 H1124 C1132.84 40 1140 47.16 1140 56 V90 H60 V56 Z" fill="#0F172A" />
  <line x1="60" y1="90" x2="1140" y2="90" stroke="#1F2937" stroke-width="1.2" />

  <!-- Windows 11 Window Controls -->
  <g stroke="#9CA3AF" stroke-width="1.2" fill="none">
    <!-- Minimize -->
    <path d="M 1060 65 L 1070 65" />
    <!-- Maximize -->
    <rect x="1090" y="60" width="10" height="10" />
    <!-- Close -->
    <path d="M 1120 60 L 1130 70 M 1120 70 L 1130 60" />
  </g>

  <!-- URL Address Bar -->
  <rect x="180" y="52" width="840" height="24" rx="6" fill="#030712" stroke="#1F2937" stroke-width="1" />
  <text x="195" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">https://ai.studio/build/plex-auditor-10beta1 (Plex Auditor Dashboard)</text>

  <!-- Left Sidebar (High fidelity black panels) -->
  <rect x="60" y="90" width="220" height="610" fill="#0B0F19" />
  <line x1="280" y1="90" x2="280" y2="700" stroke="#1F2937" stroke-width="1.2" />

  <!-- Sidebar Brand Logo & Title with current high-fidelity details (glowing quill pen) -->
  <g transform="translate(85, 115)">
    <!-- Tiny representation of the beautiful feather quill logo -->
    <!-- Curved Trail -->
    <path d="M 0,22 Q 4,23 8,20 T 13,16" stroke="url(#headerQuillGrad)" stroke-width="0.8" stroke-dasharray="0.8 1" fill="none" opacity="0.6" />
    <!-- Cinematic strip line -->
    <path d="M 0,22 C 2,23 5,23 8,21" stroke="#A78BFA" stroke-width="0.8" fill="none" />
    <!-- Film reel wheel -->
    <circle cx="9" cy="20" r="2.2" stroke="#8B5CF6" stroke-width="0.6" fill="#0F111A" />
    <circle cx="9" cy="20" r="0.5" fill="#C084FC" />
    <!-- TV and note indicators -->
    <rect x="13" y="16" width="3.5" height="2.8" rx="0.5" stroke="#3B82F6" stroke-width="0.5" fill="#111827" />
    <circle cx="19" cy="15" r="0.5" fill="#06B6D4" />
    
    <!-- Quill Pen shaft and feather nib -->
    <path d="M 2,21 L 7,16" stroke="url(#headerQuillGrad)" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 1,22 L 0,23" stroke="#E2E8F0" stroke-width="1.0" />
    <path d="M 7,16 C 4,12 6,6 15,4 C 16.5,3.6 17,5 16,7 C 13.5,11 10.5,14 7,16 Z" fill="url(#headerQuillGrad)" />
    
    <!-- Brand Type -->
    <text x="32" y="16" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#F3F4F6" letter-spacing="-0.5">Plex Quills</text>
    <text x="32" y="26" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#A78BFA" letter-spacing="1">v1.0 BETA 1</text>
  </g>

  <!-- Sidebar Menu Groups -->
  <text x="85" y="178" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#4B5563" letter-spacing="1.5">MAIN AUDIT</text>
  
  <!-- Active menu link link (glowing indicator) -->
  <rect x="75" y="195" width="190" height="34" rx="8" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
  <rect x="75" y="202" width="3" height="20" rx="1.5" fill="#8B5CF6" />
  <text x="96" y="217" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">📊 Dashboard Overview</text>
  
  <!-- Other sidebar buttons -->
  <text x="96" y="259" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">⚙️ Rule Profiles</text>
  <text x="96" y="301" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">📑 Exporter Settings</text>
  <text x="96" y="343" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">📂 Corrupted Registry</text>
  <text x="96" y="385" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">🌐 Cloud Sync</text>

  <!-- Sidebar Bottom Panel: Real-time logs engine preview -->
  <rect x="75" y="530" width="190" height="125" rx="8" fill="#030712" stroke="#1F2937" />
  <circle cx="95" cy="552" r="3" fill="#10B981" />
  <text x="105" y="556" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#10B981" letter-spacing="0.5">READY FOR EXPORT</text>
  <text x="90" y="582" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">[0.1s] File scanning completes</text>
  <text x="90" y="598" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">[0.2s] Multi-tracks matched</text>
  <text x="90" y="614" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">[0.3s] Plex compatibility complete</text>
  <text x="90" y="630" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A78BFA" font-weight="700">[INFO] Ready to report 3.2 TB</text>

  <!-- Main View Workspace Dashboard Header -->
  <g transform="translate(310, 110)">
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Library Health Analytics</text>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">Unified media metadata auditing client with direct multi-tab report controls</text>
    
    <!-- Action buttons at right top area -->
    <rect x="535" y="2" width="135" height="36" rx="8" fill="#8B5CF6" filter="url(#glow)" opacity="0.15" />
    <rect x="535" y="2" width="135" height="36" rx="8" fill="url(#purpleGrad)" />
    <text x="555" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">📥 Export Report</text>
    
    <rect x="682" y="2" width="118" height="36" rx="8" stroke="#374151" fill="#1F2937" />
    <text x="702" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">⚙️ Scan Settings</text>
  </g>

  <!-- Bento Grid Stat Counters -->
  <g transform="translate(310, 175)">
    <!-- Stats Card 1: Total Audited Movies/TV -->
    <rect x="0" y="0" width="190" height="88" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.2" />
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#9CA3AF" letter-spacing="1">HEALTHY MEDIA ITEMS</text>
    <text x="16" y="56" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#8B5CF6">1,482 items</text>
    <text x="16" y="74" font-family="'Inter', sans-serif" font-size="9" fill="#10B981" font-weight="600">▲ 24 scanned this session</text>

    <!-- Stats Card 2: Library Total Disk Size -->
    <rect x="202" y="0" width="190" height="88" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.2" />
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#9CA3AF" letter-spacing="1">TOTAL LIBRARY SIZE</text>
    <text x="16" y="56" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#3B82F6">3.18 TB</text>
    <text x="16" y="74" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Disk location: NAS-Server-01</text>

    <!-- Stats Card 3: Compliance Gauge score -->
    <rect x="404" y="0" width="190" height="88" rx="10" fill="#111827" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.5" />
    <!-- Circle indicator track -->
    <circle cx="150" cy="44" r="22" stroke="#1F2937" stroke-width="4" fill="none" />
    <circle cx="150" cy="44" r="22" stroke="#10B981" stroke-width="4" stroke-dasharray="100 38" fill="none" transform="rotate(-90, 150, 44)" />
    <text x="150" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="middle">92%</text>
    
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#9CA3AF" letter-spacing="1">METADATA SCORE</text>
    <text x="16" y="54" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">High Rating</text>
    <text x="16" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#10B981" font-weight="600">Optimal Plex Compliance</text>

    <!-- Stats Card 4: Corrupted files tab indicator warning -->
    <rect x="606" y="0" width="194" height="88" rx="10" fill="#111827" stroke="#EF4444" stroke-width="1" stroke-opacity="0.3" />
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#F87171" letter-spacing="1">CORRUPTED FILES DETECTED</text>
    <text x="16" y="56" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#EF4444">4 files</text>
    <text x="16" y="74" font-family="'Inter', sans-serif" font-size="9" fill="#F87171" font-weight="600">⚠️ Needs immediate rescan</text>
  </g>

  <!-- Interactive Grid & Tab Controls -->
  <g transform="translate(310, 285)">
    <!-- Horizontal Tab Ribbon Background -->
    <rect x="0" y="0" width="800" height="38" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
    
    <!-- Tab 1: Movies (active) -->
    <rect x="4" y="4" width="120" height="30" rx="8" fill="#1F2937" />
    <circle cx="20" cy="19" r="4" stroke="#8B5CF6" stroke-width="1.5" fill="#0F111A" />
    <text x="32" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Movies (1,154)</text>

    <!-- Tab 2: TV Shows -->
    <text x="160" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">TV Shows (248)</text>

    <!-- Tab 3: Music -->
    <text x="280" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">Music Tracks (80)</text>

    <!-- Tab 4: Corrupted tab with bright red counter dot -->
    <circle cx="430" cy="19" r="3.5" fill="#EF4444" />
    <text x="442" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#EF4444">Corrupted (4)</text>

    <!-- Advanced Rule Presets Indicator -->
    <rect x="625" y="6" width="160" height="26" rx="6" fill="#1F2937" stroke="#374151" />
    <text x="635" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F3F4F6">Preset Active: Universal</text>
  </g>

  <!-- Table Core Content Area -->
  <g transform="translate(310, 342)">
    <!-- Header line -->
    <text x="16" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#4B5563" letter-spacing="1">FILENAME &amp; REMEDIATION SUGGESTIONS</text>
    <text x="450" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#4B5563" letter-spacing="1">CODEC METADATA</text>
    <text x="640" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#4B5563" letter-spacing="1">EXCEL TAG COMPLIANCE</text>
    <line x1="0" y1="26" x2="800" y2="26" stroke="#1F2937" stroke-width="1.2" />

    <!-- File Item 1: Perfect modern stream file -->
    <g transform="translate(0, 34)">
      <rect x="0" y="0" width="800" height="42" rx="8" fill="#111827" fill-opacity="0.4" />
      <text x="16" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Dune Part Two (2024).mkv</text>
      <text x="16" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#06B6D4">Remediation: None. File ready for raw direct stream play.</text>
      <text x="450" y="20" font-family="'Inter', sans-serif" font-size="11" fill="#E5E7EB">HEVC / eac3 | 4K | 12.8 GB</text>
      
      <!-- Status Badge -->
      <rect x="640" y="11" width="140" height="20" rx="10" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1" />
      <text x="662" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#10B981">MODERN COMPATIBLE</text>
    </g>

    <!-- File Item 2: Audio Transcode Alert -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="800" height="42" rx="8" fill="#111827" fill-opacity="0.4" />
      <text x="16" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Goodfellas (1990).mkv</text>
      <text x="16" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#F59E0B">Remediation: Remux audio to AAC track (Plex web players cannot direct-stream DTS-HD).</text>
      <text x="450" y="20" font-family="'Inter', sans-serif" font-size="11" fill="#E5E7EB">h264 / dts-hd | 1080p | 14.2 GB</text>
      
      <!-- Status Badge -->
      <rect x="640" y="11" width="140" height="20" rx="10" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1" />
      <text x="668" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#F59E0B">LIMITED SUPPORTED</text>
    </g>

    <!-- File Item 3: Transcode Required (avi file) -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="800" height="42" rx="8" fill="#111827" fill-opacity="0.4" />
      <text x="16" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Pulp_Fiction_1994_Rip.avi</text>
      <text x="16" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#EF4444">Remediation: Transcode full stream container to MP4 H.264 immediately to avoid heavy CPU spikes.</text>
      <text x="450" y="20" font-family="'Inter', sans-serif" font-size="11" fill="#E5E7EB">mpeg4 / mp3 | 480p | 700 MB</text>
      
      <!-- Status Badge -->
      <rect x="640" y="11" width="140" height="20" rx="10" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-width="1" />
      <text x="662" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#EF4444">UNFRIENDLY FORMAT</text>
    </g>
  </g>

  <!-- Interactive Rule Customization Area Widget -->
  <g transform="translate(310, 532)">
    <rect x="0" y="0" width="800" height="112" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1.2" />
    <text x="20" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#A78BFA" letter-spacing="1">SPREADSHEET EXCEL COLUMN &amp; RULES INJECTION PREVIEW</text>
    
    <!-- Checklist items of column visibilities inside the Excel exporter -->
    <g transform="translate(20, 44)">
      <!-- Checkbox 1 -->
      <rect x="0" y="0" width="11" height="11" rx="2" stroke="#8B5CF6" stroke-width="1.2" fill="#1E1E2F" />
      <path d="M2.5,5 L4.5,7 L8.5,3   " stroke="#8B5CF6" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <text x="18" y="9" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">File Path</text>

      <!-- Checkbox 2 -->
      <rect x="100" y="0" width="11" height="11" rx="2" stroke="#8B5CF6" stroke-width="1.2" fill="#1E1E2F" />
      <path d="M102.5,5 L104.5,7 L108.5,3   " stroke="#8B5CF6" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <text x="118" y="9" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Analysis Notes</text>

      <!-- Checkbox 3 -->
      <rect x="230" y="0" width="11" height="11" rx="2" stroke="#8B5CF6" stroke-width="1.2" fill="#1E1E2F" />
      <path d="M232.5,5 L234.5,7 L238.5,3   " stroke="#8B5CF6" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <text x="248" y="9" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Remediation Action</text>

      <!-- Checkbox 4 -->
      <rect x="390" y="0" width="11" height="11" rx="2" stroke="#8B5CF6" stroke-width="1.2" fill="#1E1E2F" />
      <path d="M392.5,5 L394.5,7 L398.5,3   " stroke="#8B5CF6" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <text x="408" y="9" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Subtitle Tracks</text>
    </g>

    <!-- Rules status description -->
    <text x="20" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">Active audit specifications: scanning media directories recursively index files. Excel reports will be created dynamically with colorized tables, embedded ASCII bar-charts, custom column configurations and an isolated "Corrupted" registry tab.</text>
  </g>

  <!-- Browser Window Footer bar -->
  <path d="M60 660 V684 C60 692.84 67.16 700 76 700 H1124 C1132.84 700 1140 692.84 1140 684 V660 Z" fill="#0F172A" />
  <line x1="60" y1="660" x2="1140" y2="660" stroke="#1F2937" stroke-width="1" />
  
  <text x="90" y="682" font-family="'Inter', sans-serif" font-size="11" fill="#4B5563">UI engine version: 1.0.0-Beta-1 (Synced &amp; Active)</text>
  <text x="1025" y="682" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8B5CF6">Active Workspace</text>
</svg>
