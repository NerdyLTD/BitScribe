<svg viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg" width="1920" height="1200">
  <defs>
    <!-- Dark Radial background -->
    <radialGradient id="bgGradV6" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <filter id="shadowV6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer wrapper -->
  <rect width="1200" height="750" fill="#090D16" />

  <!-- Gorgeous Slate Window frame -->
  <rect x="80" y="60" width="1040" height="620" rx="12" fill="url(#bgGradV6)" filter="url(#shadowV6)" stroke="#334155" stroke-width="1.8" />

  <!-- OS Browser Header Bar -->
  <path d="M80 72 C80 65.37 85.37 60 92 60 H1108 C1114.63 60 1120 65.37 1120 72 V100 H80 V72 Z" fill="#0F172A" />
  <line x1="80" y1="100" x2="1120" y2="100" stroke="#1E293B" stroke-width="1.2" />

  <!-- macOS Controls -->
  <circle cx="105" cy="80" r="5" fill="#EF4444" />
  <circle cx="121" cy="80" r="5" fill="#F59E0B" />
  <circle cx="137" cy="80" r="5" fill="#10B981" />

  <!-- URL Bar -->
  <rect x="180" y="68" width="840" height="20" rx="5" fill="#030712" stroke="#1E293B" />
  <text x="192" y="82" font-family="'Inter', sans-serif" font-size="11" fill="#4B5563">localhost:3000/plex-music-auditor-v0.6</text>

  <!-- Left Sidebar (First implementation of fully custom Sidebar) -->
  <rect x="80" y="100" width="220" height="540" fill="#090D16" />
  <line x1="300" y1="100" x2="300" y2="640" stroke="#1E293B" stroke-width="1" />

  <text x="100" y="138" font-family="'Inter', sans-serif" font-size="14" font-weight="950" fill="#FFFFFF">PlexAuditor</text>
  <text x="188" y="137" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#06B6D4">v0.6</text>

  <!-- Sidebar Links -->
  <text x="110" y="180" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">📊 Movies &amp; TV Audit</text>
  <rect x="90" y="205" width="200" height="30" rx="6" fill="#1E293B" />
  <text x="110" y="225" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#06B6D4">🎵 Music Library Audit</text>
  <text x="110" y="265" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">⚙️ Dynamic Rules Config</text>
  <text x="110" y="305" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">📑 Exporter Wizard</text>

  <!-- Summary of Active Folder targets -->
  <rect x="90" y="470" width="200" height="130" rx="6" fill="#030712" stroke="#1E293B" />
  <text x="105" y="495" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#94A3B8">ACTIVE DIRECTORIES</text>
  <text x="105" y="520" font-family="'Inter', sans-serif" font-size="11" fill="#F3F4F6">📁 /volume1/movies</text>
  <text x="105" y="540" font-family="'Inter', sans-serif" font-size="11" fill="#F3F4F6">📁 /volume1/tv-shows</text>
  <text x="105" y="560" font-family="'Inter', sans-serif" font-size="11" fill="#06B6D4" font-weight="600">📁 /volume1/music</text>

  <!-- Main view Workspace Header -->
  <text x="330" y="140" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">Audio &amp; Music Compliance</text>
  <text x="330" y="158" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Extract and audit music metadata, verify ID3 tags, sample rate and cover coverage</text>

  <!-- Action button top right wrapper -->
  <rect x="945" y="118" width="145" height="34" rx="6" fill="#06B6D4" />
  <text x="965" y="139" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A">📥 Export Audio Excel</text>

  <!-- Bento Grid Counters -->
  <!-- Stats 1 -->
  <rect x="330" y="186" width="235" height="80" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="345" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#94A3B8" letter-spacing="1">SCANNED AUDIO TRACKS</text>
  <text x="345" y="244" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#06B6D4">542 tracks</text>

  <!-- Stats 2 -->
  <rect x="580" y="186" width="235" height="80" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="595" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#94A3B8" letter-spacing="1">AVERAGE FLAC BITRATE</text>
  <text x="595" y="244" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#10B981">842 kbps</text>

  <!-- Stats 3 -->
  <rect x="830" y="186" width="235" height="80" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="845" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#EF4444" letter-spacing="1">TAG ALERTS DETECTED</text>
  <text x="845" y="244" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#EF4444">18 issues</text>

  <!-- Main dynamic listing area of audio tracks -->
  <rect x="330" y="286" width="735" height="280" rx="8" fill="#131B2E" stroke="#1E293B" />
  
  <rect x="330" y="286" width="735" height="34" fill="#111827" />
  <line x1="330" y1="320" x2="1065" y2="320" stroke="#1E293B" />

  <!-- Columns -->
  <text x="345" y="308" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#64748B">MUSIC FILE PATH &amp; TAG AUDIT</text>
  
  <!-- Audio Item Row 1 -->
  <text x="345" y="348" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">01 - Bohemian Rhapsody.flac</text>
  <text x="345" y="362" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Tags: Artist: Queen | Album: A Night at the Opera | Year: 1975</text>
  <text x="700" y="354" font-family="'Inter', sans-serif" font-size="11" fill="#E2E8F0">FLAC (Lossless 44.1kHz)</text>
  <rect x="945" y="340" width="100" height="18" rx="3" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="0.8" />
  <text x="968" y="353" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#10B981">IDEAL QUALITY</text>

  <line x1="330" y1="380" x2="1065" y2="380" stroke="#1E293B" stroke-width="0.8" />

  <!-- Audio Item Row 2 -->
  <text x="345" y="408" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Track05.mp3</text>
  <text x="345" y="422" font-family="'Inter', sans-serif" font-size="10" fill="#EF4444">Alert: Missing Title, Artist, and Album tags. File raw structure only.</text>
  <text x="700" y="414" font-family="'Inter', sans-serif" font-size="11" fill="#EF4444">MP3 (Low Bitrate 128kbps)</text>
  <rect x="945" y="400" width="100" height="18" rx="3" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="0.8" />
  <text x="965" y="413" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#EF4444">BAD METADATA</text>

  <line x1="330" y1="440" x2="1065" y2="440" stroke="#1E293B" stroke-width="0.8" />

  <!-- Warning alert on audio transcode limits -->
  <rect x="345" y="465" width="700" height="85" rx="6" fill="#083344" stroke="#0e7490" />
  <text x="360" y="488" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#22d3ee">MUSIC INJECTION RULES PRESETS</text>
  <text x="360" y="508" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Strict ID3 tag coverage is locked. Non-flac music streams will output transcode recommendations.</text>
  <text x="360" y="526" font-family="'Inter', sans-serif" font-size="11" fill="#22d3ee">Excel engine will populate separate 'Music' sheet tab autonomously with color hierarchy.</text>

  <!-- Browser Window Footer -->
  <path d="M80 640 V670 C80 675.52 84.48 680 90 680 H1108 C1114.63 680 1120 675.52 1120 670 V640 Z" fill="#0F172A" />
  <line x1="80" y1="640" x2="1120" y2="640" stroke="#1E293B" stroke-width="1.2" />
  <text x="110" y="666" font-family="'Inter', sans-serif" font-size="11" fill="#4B5563">Draft 0.6 audio tags parser loaded | FLAC coverage 82%</text>
</svg>
