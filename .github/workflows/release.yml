name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (only needed for manual runs)'
        required: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/steward
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          releaseName: "BitScribe Steward ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}"
          releaseBody: |
            BitScribe Steward release binaries (.dmg / .app.tar.gz for macOS Apple Silicon, .msi / .exe for Windows).

            ### macOS Installation Note (Gatekeeper / Apple Silicon):
            Because this open-source build is distributed outside the Mac App Store without paid Developer ID notarization, macOS Gatekeeper may show: *"BitScribe Steward is damaged and can't be opened"*.
            
            To run the app on macOS:
            1. Drag **BitScribe Steward.app** to your `/Applications` folder.
            2. Open **Terminal** and run:
               `xattr -cr "/Applications/BitScribe Steward.app"`
            3. Launch BitScribe Steward normally.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Portable Executable
        if: matrix.platform == 'windows-latest' && (github.ref_type == 'tag' || github.event.inputs.tag != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/steward/src-tauri/target/release
          if (Test-Path "BitScribe Steward.exe") { Rename-Item "BitScribe Steward.exe" "BitScribe-Steward-Portable-Windows.exe" }
          if (Test-Path "BitScribeSteward.exe") { Rename-Item "BitScribeSteward.exe" "BitScribe-Steward-Portable-Windows.exe" }
          gh release upload ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }} BitScribe-Steward-Portable-Windows.exe
