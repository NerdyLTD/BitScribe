name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (only needed for manual runs)'
        required: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/steward
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          releaseName: "BitScribe Steward ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}"
          releaseBody: |
            BitScribe Steward release binaries (.dmg / .app.tar.gz for macOS Apple Silicon, .msi / .exe for Windows).

            ### macOS Installation & First Launch Note (Gatekeeper):
            Because BitScribe Steward is an open-source application distributed outside the Apple Mac App Store without paid Developer ID certificate notarization:

            **If macOS blocks the app with "cannot be opened because developer cannot be verified" or "damaged":**

            Option 1 (System Settings):
            1. Drag **BitScribe Steward.app** into your  folder.
            2. Attempt to launch the app once.
            3. Open **System Settings -> Privacy & Security**.
            4. Scroll down to the **Security** section where you will see *"BitScribe Steward was blocked from use..."*.
            5. Click **Open Anyway** (and enter your Mac password / Touch ID).

            Option 2 (Terminal Command):
            1. Open **Terminal** on your Mac.
            2. Run: 
            3. Launch BitScribe Steward normally.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Portable Executable
        if: matrix.platform == 'windows-latest' && (github.ref_type == 'tag' || github.event.inputs.tag != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/steward/src-tauri/target/release
          if (Test-Path "BitScribe Steward.exe") { Rename-Item "BitScribe Steward.exe" "BitScribe-Steward-Portable-Windows.exe" }
          if (Test-Path "BitScribeSteward.exe") { Rename-Item "BitScribeSteward.exe" "BitScribe-Steward-Portable-Windows.exe" }
          gh release upload ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }} BitScribe-Steward-Portable-Windows.exe
