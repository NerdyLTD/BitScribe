name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (only needed for manual runs)"
        required: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform == "macos-latest" && "aarch64-apple-darwin" || "x86_64-pc-windows-msvc" }}

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/steward
          tagName: ${{ github.ref_type == "tag" && github.ref_name || github.event.inputs.tag }}
          releaseName: "BitScribe Steward ${{ github.ref_type == "tag" && github.ref_name || github.event.inputs.tag }}"
          releaseBody: |
            BitScribe Steward official release (.dmg / .app.tar.gz for macOS Apple Silicon, .msi / .exe for Windows).

            ### macOS GUI Launching (No Terminal Required):
            1. Download and mount the **.dmg** installer file.
            2. Drag **BitScribe Steward.app** into your **Applications** folder.
            3. In **Finder**, go to your **Applications** folder.
            4. **Right-Click** (or **Control-Click**) `BitScribe Steward.app` and select **Open**.
            5. Click **Open** on the prompt. macOS will save an exception and launch the application directly in the GUI.

            *(Optional)* For automated official Apple Developer ID notarization on GitHub Releases, configure `APPLE_CERTIFICATE`, `APPLE_CERTIFICATE_PASSWORD`, `APPLE_SIGNING_IDENTITY`, `APPLE_ID`, `APPLE_PASSWORD`, and `APPLE_TEAM_ID` in Repository Secrets.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Portable Executable
        if: matrix.platform == "windows-latest" && (github.ref_type == "tag" || github.event.inputs.tag != "")
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/steward/src-tauri/target/release
          if (Test-Path "BitScribe Steward.exe") { Rename-Item "BitScribe Steward.exe" "BitScribe-Steward-Portable-Windows.exe" }
          if (Test-Path "BitScribeSteward.exe") { Rename-Item "BitScribeSteward.exe" "BitScribe-Steward-Portable-Windows.exe" }
          gh release upload ${{ github.ref_type == "tag" && github.ref_name || github.event.inputs.tag }} BitScribe-Steward-Portable-Windows.exe
